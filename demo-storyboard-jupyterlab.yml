# Records the JupyterLab extension demo video.
# See "Record the demo videos" in docs/develop/contributing.md for how to run it, after `npm run demo:lab` has built the extension once.
# The storyboard can't run that build, because shot-scraper's own python comes first on PATH and doesn't have JupyterLab.
output: docs/videos/jupyterlab.webm
cursor: true

# A fresh copy of the tour, as `npm run demo:lab` makes, but at a path we know.
sh: rm -rf /tmp/myst-author-video-lab && cp -R docs/examples/tour /tmp/myst-author-video-lab
server: exec node packages/jupyterlab/lab.mjs /tmp/myst-author-video-lab --port 9100 --no-browser --ServerApp.token=demo
url: http://127.0.0.1:9100/lab/tree/index.md?reset&token=demo
# The figure's image shows once mystmd has built the page.
wait_for: ".jp-FileEditor img[data-canonical-url]"
# Glide the cursor to each click, as in demo-storyboard.yml.
javascript: |
  document.head.insertAdjacentHTML("beforeend", `<style>
    #shot-scraper-cursor { transition: left 450ms ease-in-out, top 450ms ease-in-out, opacity 120ms !important; }
    .shot-scraper-click-ring { opacity: 0; animation-duration: 250ms !important; animation-delay: 450ms !important; }
  </style>`);
  // Clicking a block shows its Markdown and moves the text, so scenes call toCaret() to glide the cursor to the caret.
  // toCaret() waits for CodeMirror to draw the caret in its new place.
  window.toCaret = () => setTimeout(() => {
    const caret = document.querySelector(".cm-focused .cm-cursor-primary").getBoundingClientRect();
    document.dispatchEvent(new MouseEvent("mousemove", { clientX: caret.left, clientY: caret.top + caret.height / 2 }));
  }, 300);

scenes:
- name: A MyST page, rendered in JupyterLab's editor
  do:
  - pause: 2
  - scroll: {to: '.jp-FileEditor :text("Try this: complete a reference")', duration: 1.5}

- name: Complete a cross-reference
  do:
  - click: '.jp-FileEditor >> text=Try this: complete a reference'
  - js: toCaret()
  - pause: 1
  - press: ArrowDown
  # Twice: the first End stops where the line wraps.
  - press: End
  - press: End
  - type: {into: .jp-FileEditor .cm-content, text: " {numref}`", delay_ms: 90}
  - wait_for: .cm-tooltip-autocomplete
  - pause: 1.5
  - type: {into: .jp-FileEditor .cm-content, text: "fig-lo", delay_ms: 150}
  - pause: 0.8
  - press: Enter
  - pause: 2

- name: Insert a directive with /
  do:
  - press: ControlOrMeta+End
  - press: Enter
  - press: Enter
  - type: {into: .jp-FileEditor .cm-content, text: "/tip", delay_ms: 150}
  - wait_for: .cm-tooltip-autocomplete
  - pause: 1.5
  - press: Enter
  - type: {into: .jp-FileEditor .cm-content, text: "The same features as the web editor.", delay_ms: 70}
  - pause: 1
  - click: '.jp-FileEditor h2:has-text("Next")'
  - scroll: {to: '.jp-FileEditor .cm-live >> nth=-1', duration: 1}
  - pause: 2

- name: Open the preview to the side
  do:
  - press: ControlOrMeta+Shift+c
  - type: {into: .lm-CommandPalette-input, text: "MyST: Open Preview", delay_ms: 60}
  - pause: 0.8
  - press: Enter
  - pause: 3.5

# lab.mjs starts Jupyter as a child process and doesn't pass shot-scraper's stop signal on to it.
# This scene stops Jupyter, which would otherwise keep running after the recording.
- name: Stop JupyterLab
  sh: pkill -f "ServerApp.root_dir=/tmp/myst-author-video-lab" || true
