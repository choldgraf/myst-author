name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # The JupyterLab build reads the installed JupyterLab's package metadata.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install jupyterlab
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build -w packages/vscode
      - run: npm run build -w packages/jupyterlab
